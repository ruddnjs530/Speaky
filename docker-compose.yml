version: '3.8'

services:
  # 1. React Client (Production Build)
  client:
    build:
      context: .
      dockerfile: apps/client-web/Dockerfile
      target: prod  # Uses Nginx
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:8080/ws/signaling}
    ports:
      - "5173:80"   # Expose Nginx port 80 as 5173 for consistency
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_WS_URL=ws://localhost:8080/ws/signaling
    depends_on:
      - server-sc

  # 2. Media Server (Production Binary)
  server-media:
    build:
      context: .
      dockerfile: apps/server-media/Dockerfile
      target: prod
    ports:
      - "8090:8090"
      - "50000-50100:50000-50100/udp"
      - "50000:50000/tcp" # Explicit TCP mapping for ICE-TCP
    volumes:
      # Mount Proto generated files for runtime if needed by legacy code paths
      - ./packages/proto/generated/go:/app/proto:ro
    environment:
      - PORT=8090
      - AI_SERVER_ADDR=server-ai:50051
      - PION_NAT_1_1_HOST=127.0.0.1 # Essential for Localhost TCP Bridge
      - WEBRTC_MAX_PORT=50100
      - AI_BUFFER_DURATION=5000 # Increased from default 400ms
    depends_on:
      server-ai:
        condition: service_healthy

  # 3. AI Server (Production Mode)
  server-ai:
    build:
      context: .
      dockerfile: apps/server-ai/Dockerfile
      target: prod
    expose:
      - "50051"
    volumes:
      # RVC Paths (Must be valid on host)
      - ${RVC_ASSETS_PATH:-./rvc-models/assets}:/rvc-code/assets:ro
      - ${RVC_CODE_INFER_PATH:-./rvc-models/infer}:/rvc-code/infer:ro
      - ${RVC_CODE_CONFIGS_PATH:-./rvc-models/configs}:/rvc-code/configs
      # Mount Python Protos (They are interpreted at runtime)
      - ./packages/proto/generated/python:/packages/proto/generated/python:ro
    environment:
      - PYTHONPATH=/app:/packages/proto/generated/python
      - RVC_WEBUI_ROOT=/rvc-code
      - MODELS_CONFIG_PATH=/app/src/config/models.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.socket(); s.connect((\"localhost\",50051)); s.close()'"]
      interval: 10s
      timeout: 5s
      retries: 20    # 20 * 10s = 200s (~3.3 mins)
      start_period: 30s

  # 4. Signaling Server (Production JAR)
  server-sc:
    build:
      context: .
      dockerfile: apps/server-sc/Dockerfile
      target: runner
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MEDIA_SERVER_HOST=server-media
      - MEDIA_SERVER_PORT=8090
