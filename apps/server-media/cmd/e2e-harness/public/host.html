<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaky | Host Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&family=JetBrains+Mono&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #08090d;
            --surface-color: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-accent: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --primary-glow: rgba(99, 102, 241, 0.4);
            --success-color: #10b981;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-blur: blur(20px);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            display: flex;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
        }

        .studio-layout {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Video Area */
        .video-canvas {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: rgba(0, 0, 0, 0.2);
            position: relative;
        }

        .video-viewport {
            max-width: 1400px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Sidebar */
        .sidebar {
            width: 380px;
            height: 100%;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 32px;
            gap: 24px;
            z-index: 10;
        }

        .nav-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 100px;
            color: var(--text-dim);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
        }

        .nav-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        header {
            margin-bottom: 8px;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            background: var(--primary-accent);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }

        .role-tag {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 100px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: #818cf8;
            gap: 6px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 24px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-wrapper label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        input:focus {
            outline: none;
            border-color: #6366f1;
            background: rgba(255, 255, 255, 0.08);
        }

        .actions {
            display: grid;
            grid-template-columns: auto auto 1fr;
            gap: 12px;
            margin-top: 8px;
        }

        button {
            padding: 12px;
            border-radius: 12px;
            border: 1px solid transparent;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-primary {
            background: var(--primary-accent);
            color: white;
            padding-left: 24px;
            padding-right: 24px;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--primary-glow);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--border-color);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        #logs {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-dim);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .log-time {
            color: #6366f1;
            margin-right: 8px;
            font-weight: bold;
        }

        .log-success {
            color: var(--success-color);
        }

        .log-error {
            color: #ef4444;
        }

        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
    </style>
</head>

<body>
    <main class="studio-layout">
        <section class="video-canvas">
            <div class="video-viewport">
                <div id="localContainer" style="height: 100%;">
                    <video id="localVideo" autoplay muted playsinline></video>
                </div>
            </div>
        </section>

        <aside class="sidebar">
            <a href="guest.html" class="nav-toggle">
                Switch Role
                <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3">
                    </path>
                </svg>
            </a>

            <header>
                <h1>Speaky</h1>
                <div class="role-tag">Host Studio</div>
            </header>

            <section class="controls-group">
                <div class="input-wrapper">
                    <label for="roomId">Room ID</label>
                    <input type="text" id="roomId" placeholder="Room" value="test-room-1">
                </div>
                <div class="input-wrapper">
                    <label for="userId">User ID</label>
                    <input type="text" id="userId" placeholder="User" value="user-host">
                </div>

                <div class="actions">
                    <button class="btn-secondary" onclick="startCamera()" title="Start Camera">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z">
                            </path>
                        </svg>
                    </button>
                    <button class="btn-secondary" onclick="startScreenShare()" title="Share Screen">
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                            </path>
                        </svg>
                    </button>
                    <button id="btnJoin" class="btn-primary" onclick="joinRoom()">
                        Broadcast
                    </button>
                </div>
            </section>

            <footer id="logs"></footer>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
