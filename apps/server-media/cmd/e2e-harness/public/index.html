<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Speaky Media E2E Test</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1a1a1a;
            color: #fff;
        }

        .container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        video {
            width: 400px;
            height: 300px;
            background: #000;
            border: 2px solid #333;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        input {
            padding: 8px;
            border-radius: 4px;
            border: none;
        }

        button {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #logs {
            margin-top: 20px;
            width: 800px;
            height: 150px;
            background: #222;
            overflow-y: scroll;
            padding: 10px;
            border: 1px solid #444;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <h1>Speaky Media E2E Harness</h1>

    <div class="controls">
        <input type="text" id="roomId" placeholder="Room ID" value="test-room-1">
        <input type="text" id="userId" placeholder="User ID" value="user-1">
        <button id="btnStart" onclick="startCamera()">Start Camera</button>
        <button id="btnScreen" onclick="startScreenShare()">Share Screen</button>
        <button id="btnJoin" onclick="joinRoom()">Join Room</button>
    </div>

    <div class="container">
        <div>
            <h3>Local Video</h3>
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div>
            <h3>Remote Video (Delayed ~600ms)</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <div id="logs"></div>

    <script src="app.js"></script>
</body>

</html>
