<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaky | Media Harness Launcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0d12;
            --surface-color: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-blur: blur(12px);
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image:
                radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
        }

        .launcher-card {
            width: 100%;
            max-width: 800px;
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-bottom: 48px;
        }

        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .option-card {
            background: var(--surface-color);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            text-decoration: none;
            color: inherit;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .option-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 8px;
            transition: var(--transition);
        }

        .option-card:hover .icon-circle {
            transform: scale(1.1);
        }

        .host .icon-circle {
            color: #6366f1;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .guest .icon-circle {
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
        }

        .desc {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .btn-fake {
            margin-top: 12px;
            padding: 8px 24px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
        }

        .option-card:hover .btn-fake {
            background: var(--text-main);
            color: var(--bg-color);
        }
    </style>
</head>

<body>
    <div class="launcher-card">
        <h1>Speaky</h1>
        <p>Choose your role to start the media session</p>

        <div class="options">
            <a href="host.html" class="option-card host">
                <div class="icon-circle">
                    <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z">
                        </path>
                    </svg>
                </div>
                <h2>Host Studio</h2>
                <span class="desc">Stream your camera or screen to others.</span>
                <div class="btn-fake">Launch Host</div>
            </a>

            <a href="guest.html" class="option-card guest">
                <div class="icon-circle">
                    <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z">
                        </path>
                    </svg>
                </div>
                <h2>Guest View</h2>
                <span class="desc">Watch and listen to the host's stream.</span>
                <div class="btn-fake">Launch Guest</div>
            </a>
        </div>
    </div>
</body>

</html>
