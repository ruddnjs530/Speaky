# Spring Application
spring.application.name=server-sc

# H2 Database Configuration (MVP)
spring.datasource.url=jdbc:h2:mem:speaky
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# H2 Console (개발용)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=your-256-bit-secret-key-change-in-production-please-make-it-longer!
jwt.expiration=3600

# Logging
logging.level.org.speaky.serversc=DEBUG
logging.level.org.springframework.security=DEBUG

# Session Storage Configuration
session.storage.type=memory
session.ttl.minutes=30
session.cleanup.interval.minutes=5

# Media Server gRPC Configuration
media.server.host=${MEDIA_SERVER_HOST:localhost}
media.server.port=${MEDIA_SERVER_PORT:8081}

# SSL/TLS Configuration (Production)
# media.server.ssl.enabled=${MEDIA_SERVER_SSL_ENABLED:false}
# media.server.ssl.cert-chain-file=/path/to/cert-chain.pem
# media.server.ssl.private-key-file=/path/to/private-key.pem
