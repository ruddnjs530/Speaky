<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="speakyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8753A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0B13A;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle (Optional, for easy visibility) -->
  <!-- <circle cx="256" cy="256" r="240" fill="#ffffff" /> -->

  <!-- Stylized 'S' / Sound Wave Shape -->
  <path d="M160 140 C 120 180, 120 332, 160 372" stroke="url(#speakyGradient)" stroke-width="48" stroke-linecap="round" fill="none"/>
  <path d="M256 90 C 180 166, 180 346, 256 422" stroke="url(#speakyGradient)" stroke-width="48" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M352 140 C 392 180, 392 332, 352 372" stroke="url(#speakyGradient)" stroke-width="48" stroke-linecap="round" fill="none" opacity="0.6"/>
  
  <!-- Central Pulse Dot -->
  <circle cx="256" cy="256" r="32" fill="url(#speakyGradient)" filter="url(#glow)">
    <animate attributeName="r" values="32;40;32" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.8;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
