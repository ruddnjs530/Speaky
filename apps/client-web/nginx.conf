server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅 설정
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 에셋 캐싱 설정 (성능 최적화)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # 에러 페이지 설정
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
