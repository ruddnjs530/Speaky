syntax = "proto3";

package control.v1;

option go_package = "mediaserver/proto;protopb";
option java_multiple_files = true;
option java_package = "org.speaky.serversc.grpc";
option java_outer_classname = "ControlProto";

service MediaControlService {
  // 1. Resource Management
  rpc CreateRoom (CreateRoomRequest) returns (CreateRoomResponse);
  rpc DeleteRoom (DeleteRoomRequest) returns (DeleteRoomResponse);
  rpc CreateProfile (CreateProfileRequest) returns (VoiceProfile);

  // 2. Signaling & Connectivity
  rpc JoinRoom (JoinRoomRequest) returns (JoinRoomResponse);
  rpc LeaveRoom (LeaveRoomRequest) returns (LeaveRoomResponse);
  rpc Renegotiate (RenegotiateRequest) returns (RenegotiateResponse);
  rpc SubmitIceCandidate (SubmitIceCandidateRequest) returns (SubmitIceCandidateResponse);

  // 3. Feature Control
  rpc UpdateSessionConfig (UpdateSessionConfigRequest) returns (UpdateSessionConfigResponse);
}

// --- Messages ---

message CreateRoomRequest {
  string room_id = 1; 
  string host_id = 2; // 방 생성 시 송출 권한을 가진 유저를 지정합니다.
  string voice_profile_id = 3; // 생성된 보이스 프로필 ID
}

message CreateRoomResponse {
  bool success = 1;
  string room_id = 2;
}

message DeleteRoomRequest {
  string room_id = 1;
}

message DeleteRoomResponse {
  bool success = 1;
}

message JoinRoomRequest {
  string room_id = 1;
  string user_id = 2;
  string sdp_offer = 3;
}

message JoinRoomResponse {
  string sdp_answer = 1;
}

message LeaveRoomRequest {
  string room_id = 1;
  string user_id = 2;
}

message LeaveRoomResponse {
  bool success = 1;
}

message RenegotiateRequest {
  string room_id = 1;
  string user_id = 2;
  string sdp_offer = 3;
}

message RenegotiateResponse {
  string sdp_answer = 1;
}

message SubmitIceCandidateRequest {
  string room_id = 1;
  string user_id = 2;
  string candidate = 3;
  string sdp_mid = 4;
  int32 sdp_m_line_index = 5;
}

message SubmitIceCandidateResponse {
  bool success = 1;
}

message UpdateSessionConfigRequest {
  string room_id = 1;        // 어떤 방의 설정을 바꿀지 알려줍니다.
  string voice_model_id = 2; // 변경할 모델 파일 ID
  float pitch_scale = 3;     // 변경할 피치 값
}

message UpdateSessionConfigResponse {
  bool success = 1;
}

message CreateProfileRequest {
  int64 voice_model_id = 1;
  float pitch_scale = 2;
}

message VoiceProfile {
  string id = 1;
  int64 voice_model_id = 2;
  float pitch_scale = 3;
}


