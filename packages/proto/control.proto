syntax = "proto3";

package control.v1;

option go_package = "mediaserver/proto;protopb";

// ControlService handles room management and signaling.
service ControlService {
  // 1. Create Room
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);

  // 2. Join Room (Signaling - Offer/Answer)
  // Corresponds to SC's StartHostPeer
  rpc JoinRoom(JoinRoomRequest) returns (JoinRoomResponse);

  // 3. ICE Candidate Exchange (Trickle ICE Support)
  // Corresponds to SC's TrickleIce(roomId, peerId, candidate)
  // Needed because client might send candidates after the initial Offer.
  rpc SubmitIceCandidate(SubmitIceCandidateRequest) returns (SubmitIceCandidateResponse);

  // 4. Leave Room & Resource Cleanup
  // Corresponds to SC's ClosePeer
  rpc LeaveRoom(LeaveRoomRequest) returns (LeaveRoomResponse);
}

// --- Messages ---

message CreateRoomRequest {
  string host_id = 1;
}

message CreateRoomResponse {
  string room_id = 1;
}

message JoinRoomRequest {
  string room_id = 1;
  string user_id = 2; // Corresponds to peerId
  string sdp_offer = 3;
}

message JoinRoomResponse {
  string sdp_answer = 1;
}

message SubmitIceCandidateRequest {
  string room_id = 1;
  string user_id = 2;
  string candidate = 3; // JSON string or candidate string
  string sdp_mid = 4;
  int32 sdp_m_line_index = 5;
}

message SubmitIceCandidateResponse {
  bool success = 1;
}

message LeaveRoomRequest {
  string room_id = 1;
  string user_id = 2;
}

message LeaveRoomResponse {
  bool success = 1;
}
