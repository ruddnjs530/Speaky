syntax = "proto3";

package voice.v1;

option go_package = "mediaserver/proto;protopb";

service VoiceService {
  rpc GetStatus (StatusRequest) returns (StatusResponse);
  rpc ListModels (ListModelsRequest) returns (ListModelsResponse);
  rpc ConvertStream (stream AudioChunk) returns (stream AudioChunk);
}

message StatusRequest {}

message StatusResponse {
  string status = 1;
}

message ListModelsRequest {}

message ListModelsResponse {
  repeated VoiceModel models = 1;
}

message VoiceModel {
  string model_name = 1;
  int64 voice_model_id = 2;
}

message AudioChunk {
  bytes pcm = 1;
  int32 sample_rate = 2;
  int32 channels = 3;
  uint32 timestamp = 4;
  int64 voice_model_id = 5;
}
